<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wave Lab</title><style>body{margin:0;background:#f8fafc;color:#172033;font:14px system-ui}.bar{padding:11px 16px;background:#fff;border-bottom:1px solid #e2e8f0;font-weight:700}.bar span{font-size:11px;color:#2563eb;margin-right:9px}main{display:grid;grid-template-columns:1fr 250px;height:calc(100vh - 42px)}canvas{width:100%;height:100%;background-color:white;background-image:linear-gradient(#edf2f7 1px,transparent 1px),linear-gradient(90deg,#edf2f7 1px,transparent 1px);background-size:42px 42px}aside{padding:20px;background:white;border-left:1px solid #e2e8f0}label{display:block;margin:22px 0 8px;font-weight:600}input{width:100%;accent-color:#2563eb}output{float:right;color:#2563eb}.key{display:flex;gap:7px;margin-top:18px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#2563eb}.box{margin-top:18px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;line-height:1.6}@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:1fr auto}aside{border:0;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}aside label{margin:3px 0 5px}.box,.key{margin-top:0}}</style></head><body><div class="bar"><span>LIVE MODEL</span>Wave interference</div><main><canvas id="c"></canvas><aside><div><label>Amplitude <output id="ao">1.0</output></label><input id="a" type="range" min="3" max="40" value="20"></div><div><label>Frequency <output id="fo">2.0 Hz</output></label><input id="f" type="range" min="5" max="50" value="20"></div><div><label>Phase offset <output id="po">0°</output></label><input id="p" type="range" min="0" max="360" value="0"></div><div><div class="key"><span class="dot"></span> Resultant wave</div><div class="box">Superposition: the combined displacement is the sum of both wave amplitudes at each point.</div></div></aside></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),a=document.querySelector('#a'),f=document.querySelector('#f'),p=document.querySelector('#p');let t=0;function draw(){let w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);let amp=+a.value,fr=+f.value/10,phase=+p.value*Math.PI/180,cy=h/2;x.strokeStyle='#38bdf8';x.lineWidth=1.5;x.beginPath();for(let z=0;z<w;z++){let y=cy-Math.sin(z*.025*fr-t)*amp-Math.sin(z*.025*fr-t+phase)*amp;if(!z)x.moveTo(z,y);else x.lineTo(z,y)}x.stroke();x.strokeStyle='#2563eb';x.lineWidth=3;x.beginPath();for(let z=0;z<w;z++){let y=cy-(Math.sin(z*.025*fr-t)+Math.sin(z*.025*fr-t+phase))*amp;if(!z)x.moveTo(z,y);else x.lineTo(z,y)}x.stroke();document.querySelector('#ao').textContent=(amp/20).toFixed(1);document.querySelector('#fo').textContent=fr.toFixed(1)+' Hz';document.querySelector('#po').textContent=p.value+'°';t+=.045;requestAnimationFrame(draw)}new ResizeObserver(draw).observe(c);[a,f,p].forEach(e=>e.addEventListener('input',draw));draw();</script></body></html>
