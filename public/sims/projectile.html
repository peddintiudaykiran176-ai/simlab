<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projectile Motion Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font:14px ui-sans-serif,system-ui,-apple-system,sans-serif}.wrap{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 265px;grid-template-rows:auto 1fr}.bar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 14px;background:white;border-bottom:1px solid #e2e8f0}.badge{color:#2563eb;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.bar strong{font-size:14px}.status{margin-left:auto;color:#64748b;font-size:12px}.stage{position:relative;min-height:280px;background-color:#fff;background-image:linear-gradient(#e8eef6 1px,transparent 1px),linear-gradient(90deg,#e8eef6 1px,transparent 1px);background-size:44px 44px}canvas{display:block;width:100%;height:100%}.controls{padding:17px;background:white;border-left:1px solid #e2e8f0;overflow:auto}.row{margin-bottom:19px}.row label{display:flex;justify-content:space-between;font-weight:600;font-size:12px;margin-bottom:8px}.row output{font-family:ui-monospace,monospace;color:#2563eb}.row input{width:100%;accent-color:#2563eb}select{width:100%;height:34px;background:white;border:1px solid #dbe3ef;border-radius:7px;padding:0 8px;color:#172033}.actions{display:flex;gap:7px}.actions button{flex:1;height:34px;border:0;border-radius:7px;background:#2563eb;color:white;font-weight:650;cursor:pointer}.actions .secondary{background:#eef2f7;color:#334155}.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.metric{padding:9px;border:1px solid #e2e8f0;border-radius:8px}.metric small{display:block;color:#64748b;font-size:10px}.metric b{font:600 14px ui-monospace,monospace}.note{margin-top:14px;padding:10px;border-radius:8px;background:#eff6ff;color:#31517b;font-size:11px;line-height:1.5}@media(max-width:680px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}.controls{border-left:0;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:12px}.row{margin-bottom:5px}.actions,.readout,.note{grid-column:1/-1}.stage{min-height:220px}}
</style></head><body><div class="wrap"><div class="bar"><span class="badge">LIVE MODEL</span><strong>Projectile trajectory</strong><span class="status" id="status">Ready to launch</span></div><div class="stage"><canvas id="plot" aria-label="Animated projectile trajectory"></canvas></div><aside class="controls"><div class="row"><label for="angle">Launch angle <output id="angleOut">45°</output></label><input id="angle" type="range" min="10" max="80" value="45"></div><div class="row"><label for="speed">Initial speed <output id="speedOut">25 m/s</output></label><input id="speed" type="range" min="10" max="40" value="25"></div><div class="row"><label for="gravity">Gravity</label><select id="gravity"><option value="9.81">Earth · 9.81 m/s²</option><option value="1.62">Moon · 1.62 m/s²</option><option value="3.71">Mars · 3.71 m/s²</option></select></div><div class="actions"><button id="launch">Launch</button><button class="secondary" id="reset">Reset</button></div><div class="readout"><div class="metric"><small>RANGE</small><b id="range">— m</b></div><div class="metric"><small>MAX HEIGHT</small><b id="height">— m</b></div><div class="metric"><small>FLIGHT TIME</small><b id="time">— s</b></div><div class="metric"><small>Vₓ · Vᵧ</small><b id="vel">—</b></div></div><div class="note">Try 30° and 60° at the same speed. Complementary angles travel the same horizontal distance.</div></aside></div>
<script>
const c=document.querySelector('#plot'),ctx=c.getContext('2d'),angle=document.querySelector('#angle'),speed=document.querySelector('#speed'),gravity=document.querySelector('#gravity');let t=0,playing=false,points=[],raf=0;const $=s=>document.querySelector(s);function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}new ResizeObserver(resize).observe(c);function params(){const a=+angle.value*Math.PI/180,v=+speed.value,g=+gravity.value;return {a,v,g,vx:v*Math.cos(a),vy:v*Math.sin(a),T:2*v*Math.sin(a)/g,R:v*v*Math.sin(2*a)/g,H:v*v*Math.sin(a)**2/(2*g)}}function update(){const p=params();$('#angleOut').textContent=angle.value+'°';$('#speedOut').textContent=speed.value+' m/s';$('#range').textContent=p.R.toFixed(1)+' m';$('#height').textContent=p.H.toFixed(1)+' m';$('#time').textContent=p.T.toFixed(2)+' s';$('#vel').textContent=p.vx.toFixed(1)+' · '+p.vy.toFixed(1);draw()}function draw(){const w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h);const p=params(),pad=38,scale=Math.min((w-pad*2)/(p.R*1.18),(h-pad*2)/(p.H*1.5));const ox=pad,oy=h-pad;ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(ox,16);ctx.lineTo(ox,oy);ctx.lineTo(w-12,oy);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='11px ui-monospace';ctx.fillText('y (m)',8,19);ctx.fillText('x (m)',w-42,h-10);for(let x=0;x<=p.R;x+=Math.max(10,Math.round(p.R/5/10)*10)){let xx=ox+x*scale;ctx.strokeStyle='#e2e8f0';ctx.beginPath();ctx.moveTo(xx,oy);ctx.lineTo(xx,oy-4);ctx.stroke();ctx.fillStyle='#64748b';ctx.fillText(Math.round(x),xx-5,oy+15)}const upto=playing?Math.min(t,p.T):p.T;ctx.beginPath();for(let tt=0;tt<=upto;tt+=p.T/100){let x=ox+p.vx*tt*scale,y=oy-(p.vy*tt-.5*p.g*tt*tt)*scale;if(tt===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='#93c5fd';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);let x=ox+p.vx*upto*scale,y=oy-(p.vy*upto-.5*p.g*upto*upto)*scale;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle='#2563eb';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();if(points.length>1){ctx.beginPath();points.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.strokeStyle='#1d4ed8';ctx.lineWidth=2.5;ctx.stroke()}}function frame(){if(!playing)return;const p=params();t+=.025;const scale=Math.min((c.clientWidth-76)/(p.R*1.18),(c.clientHeight-76)/(p.H*1.5));points.push({x:38+p.vx*t*scale,y:c.clientHeight-38-(p.vy*t-.5*p.g*t*t)*scale});if(t>=p.T){t=p.T;playing=false;$('#status').textContent='Landed · '+p.R.toFixed(1)+' m';}else $('#status').textContent='In flight · '+t.toFixed(2)+' s';draw();if(playing)raf=requestAnimationFrame(frame)}$('#launch').onclick=()=>{cancelAnimationFrame(raf);t=0;points=[];playing=true;$('#status').textContent='In flight';frame()};$('#reset').onclick=()=>{cancelAnimationFrame(raf);playing=false;t=0;points=[];$('#status').textContent='Ready to launch';update()};[angle,speed,gravity].forEach(el=>el.addEventListener('input',update));update();
</script></body></html>
