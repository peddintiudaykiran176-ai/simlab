<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PID Control Lab</title><style>body{margin:0;background:#f8fafc;color:#172033;font:14px system-ui}.bar{padding:11px 16px;background:#fff;border-bottom:1px solid #e2e8f0;font-weight:700}.bar span{font-size:11px;color:#2563eb;margin-right:9px}main{display:grid;grid-template-columns:1fr 250px;height:calc(100vh - 42px)}canvas{width:100%;height:100%;background:white;background-image:linear-gradient(#edf2f7 1px,transparent 1px),linear-gradient(90deg,#edf2f7 1px,transparent 1px);background-size:42px 42px}aside{padding:20px;background:white;border-left:1px solid #e2e8f0}label{display:block;margin:20px 0 7px;font-weight:600}input{width:100%;accent-color:#2563eb}output{float:right;color:#2563eb}button{width:100%;height:35px;margin-top:16px;border:0;border-radius:7px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.box{margin-top:14px;padding:10px;border:1px solid #e2e8f0;border-radius:8px}.box small{color:#64748b}.box b{display:block;margin-top:5px;font-family:ui-monospace}@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:1fr auto}aside{border:0;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}aside label{margin:3px 0 5px}button,.box:last-child{margin:0}}</style></head><body><div class="bar"><span>LIVE MODEL</span>PID altitude control</div><main><canvas id="c"></canvas><aside><div><label>Proportional Kₚ <output id="po">1.2</output></label><input id="p" type="range" min="1" max="50" value="12"></div><div><label>Integral Kᵢ <output id="io">0.2</output></label><input id="i" type="range" min="0" max="20" value="2"></div><div><label>Derivative Kᵈ <output id="do">0.6</output></label><input id="d" type="range" min="0" max="30" value="6"></div><button id="reset">Reset model</button><div class="box"><small>TARGET ALTITUDE</small><b>10 m</b></div><div class="box"><small>CONTROL OUTPUT</small><b id="out">Stabilising</b></div></aside></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),p=document.querySelector('#p'),i=document.querySelector('#i'),d=document.querySelector('#d');let t=0,reset=0;function draw(){let w=c.clientWidth,h=c.clientHeight,dp=devicePixelRatio||1;c.width=w*dp;c.height=h*dp;x.setTransform(dp,0,0,dp,0,0);x.strokeStyle='#2563eb';x.lineWidth=3;x.beginPath();for(let z=0;z<w;z++){let sec=z/w*12;let damp=.15+(+d.value/30)*.55;let osc=5*Math.exp(-damp*sec)*Math.cos((1+(+p.value/20))*sec);let drift=1.5*Math.exp(-(+i.value/20)*sec);let y=h*.42-(osc+drift)*h*.035;if(!z)x.moveTo(z,y);else x.lineTo(z,y)}x.stroke();x.strokeStyle='#f97316';x.setLineDash([6,5]);x.beginPath();x.moveTo(0,h*.42);x.lineTo(w,h*.42);x.stroke();x.setLineDash([]);document.querySelector('#po').textContent=(p.value/10).toFixed(1);document.querySelector('#io').textContent=(i.value/10).toFixed(1);document.querySelector('#do').textContent=(d.value/10).toFixed(1);document.querySelector('#out').textContent=+d.value<3?'Oscillating':+d.value>20?'Slow response':'Stable · tuned';requestAnimationFrame(draw)}new ResizeObserver(draw).observe(c);[p,i,d].forEach(e=>e.addEventListener('input',draw));document.querySelector('#reset').onclick=()=>{p.value=12;i.value=2;d.value=6;draw()};draw();</script></body></html>
