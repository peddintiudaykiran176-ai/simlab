<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oscillation Lab</title><style>body{margin:0;font:14px system-ui;background:#f8fafc;color:#172033}.bar{padding:11px 16px;background:#fff;border-bottom:1px solid #e2e8f0;font-weight:700}.bar span{font-size:11px;color:#2563eb;margin-right:9px}main{display:grid;grid-template-columns:1fr 250px;height:calc(100vh - 42px)}canvas{width:100%;height:100%;background:linear-gradient(#fff,#f8fafc)}aside{padding:20px;border-left:1px solid #e2e8f0;background:white}label{display:block;font-weight:600;margin:20px 0 7px}input{width:100%;accent-color:#2563eb}output{color:#2563eb;float:right}.box{padding:12px;border:1px solid #e2e8f0;border-radius:8px;margin-top:15px}.box small{color:#64748b}.box b{display:block;margin-top:5px;font:600 15px ui-monospace}@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:1fr auto}aside{border-left:0;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}aside label{margin:2px 0 5px}.box{margin:0}}</style></head><body><div class="bar"><span>LIVE MODEL</span>Simple harmonic motion</div><main><canvas id="c"></canvas><aside><div><label>Length <output id="lo">1.2 m</output></label><input id="l" type="range" min="40" max="180" value="120"></div><div><label>Amplitude <output id="ao">35°</output></label><input id="a" type="range" min="10" max="70" value="35"></div><div class="box"><small>PERIOD</small><b id="period">— s</b></div><div class="box"><small>ENERGY</small><b>Conserved</b></div><div class="box"><small>MODEL</small><b>θ(t) = θ₀ cos(ωt)</b></div></aside></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),l=document.querySelector('#l'),a=document.querySelector('#a');let t=0;function draw(){let w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);let L=+l.value,amp=+a.value*Math.PI/180,period=2*Math.PI*Math.sqrt(L/100/9.81),cx=w/2,cy=55,r=L*1.6,theta=amp*Math.cos(t*2*Math.PI/period),bx=cx+Math.sin(theta)*r,by=cy+Math.cos(theta)*r;x.strokeStyle='#cbd5e1';x.lineWidth=3;x.beginPath();x.moveTo(cx,cy);x.lineTo(bx,by);x.stroke();x.fillStyle='#2563eb';x.beginPath();x.arc(bx,by,16,0,7);x.fill();x.fillStyle='#334155';x.beginPath();x.arc(cx,cy,5,0,7);x.fill();x.strokeStyle='#bfdbfe';x.setLineDash([5,5]);x.beginPath();x.arc(cx,cy,r,Math.PI/2-amp,Math.PI/2+amp);x.stroke();x.setLineDash([]);document.querySelector('#lo').textContent=(L/100).toFixed(2)+' m';document.querySelector('#ao').textContent=a.value+'°';document.querySelector('#period').textContent=period.toFixed(2)+' s';t+=.025;requestAnimationFrame(draw)}new ResizeObserver(draw).observe(c);draw();</script></body></html>
